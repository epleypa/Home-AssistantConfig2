- binary_sensor:
  - device_class: smoke
    default_entity_id: binary_sensor.smoke_alarm
    name: Smoke Alarm
    state: '{{ is_state(''sensor.ecolink_firefighter_smoke_detector'', ''detected'')
      }}'
  - device_class: safety
    default_entity_id: binary_sensor.co_alarm
    name: CO Alarm
    state: '{{ is_state(''sensor.ecolink_firefighter_carbon_monoxide_detector'', ''detected'')
      }}'
 
  - delay_on: 0:05:00
    delay_off: 0:02:00
    default_entity_id: binary_sensor.washer_status
    icon: mdi:washing-machine
    name: Washer Cycle
    state: '{{ states(''sensor.washer_current_consumption'')|float > 5 }}'
  - delay_on: 0:05:00
    delay_off: 0:01:00
    default_entity_id: binary_sensor.dryer_status
    icon: mdi:tumble-dryer
    name: Dryer Cycle
    state: '{{ states(''sensor.dryer_current_consumption'')|float > 5 }}'
 
  - default_entity_id: binary_sensor.sleep_mode
    icon: '{% if is_state(''sensor.sleep_mode'', ''on'') %}mdi:sleep{% else %}mdi:sleep-off{%
      endif %}'
    name: Sleep Mode
    state: '{% if is_state(''alarm_control_panel.10th_street'', ''armed_home'') and
      (now().strftime(''%H:%M:%S'') >= ''10:00:00'' or now().strftime(''%H:%M:%S'')
      <= ''05:00:00'')%}true{% else %}false{% endif %}'


