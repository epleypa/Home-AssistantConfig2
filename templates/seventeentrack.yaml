    - trigger:
      - platform: time_pattern
        minutes: "/5"
      action:
        - action: seventeentrack.get_packages
          data:
            config_entry_id: 01KC4P3BV9DE5NYEBF01XSW8YJ
            package_state:
              - in_transit
          response_variable: packages_in_transit
      sensor:
        - name: PackagesInTransit
          unique_id: seventeentrack_packages_in_transit
          state: "{{ now().isoformat() }}"
          icon: mdi:truck-delivery-outline
          attributes:
            packages: "{{ packages_in_transit.packages }}"

    - trigger:
        - platform: time_pattern
          minutes: "/5"
      action:
        - action: seventeentrack.get_packages
          data:
            config_entry_id: 01KC4P3BV9DE5NYEBF01XSW8YJ
            package_state:
              - not_found
          response_variable: packages_not_found
      sensor:
        - name: PackagesNotFound
