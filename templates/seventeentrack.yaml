          state: "{{ now().isoformat() }}"
          icon: mdi:package-variant-closed
          attributes:
            packages: "{{ packages_not_found.packages }}"

    - trigger:
        - platform: time_pattern
          minutes: "/5"
      action:
        - action: seventeentrack.get_packages
          data:
            config_entry_id: 01KC4P3BV9DE5NYEBF01XSW8YJ
            package_state:
              - delivered
          response_variable: packages_delivered
      sensor:
        - name: PackagesDelivered
